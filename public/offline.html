<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline | Bohemika SmartApp</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #334155 0%, #0f172a 62%, #020617 100%);
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      main {
        width: min(92vw, 540px);
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.68);
        backdrop-filter: blur(4px);
        padding: 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aplikace je dočasně offline</h1>
      <p>Zkontroluj připojení a stránku obnov. Poslední uložená verze aplikace bude dostupná po návratu online.</p>
    </main>
  </body>
</html>
